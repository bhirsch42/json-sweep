[package]
name = "json_sweep"
version = "0.1.0"
edition = "2024"
authors = ["Ben Hirsch <benhirsch42@gmail.com>"]
description = "Fan out a base JSON config into N variants by sweeping values along one or more axes."
repository = "https://github.com/bhirsch42/json-sweep"
homepage = "https://github.com/bhirsch42/json-sweep"
license = "MIT"
readme = "README.md"
keywords = ["json", "cli", "sweep", "config", "jq"]
categories = ["command-line-utilities"]

[[bin]]
name = "jswp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

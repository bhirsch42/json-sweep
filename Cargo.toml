[package]
name = "json_sweep"
version = "0.1.0"
edition = "2024"
description = "Expand a sweep of axis assignments into N concrete JSON configs."
repository = "https://github.com/bhirsch42/json-sweep"
license = "MIT"
readme = "README.md"
keywords = ["json", "cli", "sweep", "config", "jq"]
categories = ["command-line-utilities"]

[[bin]]
name = "jswp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
nom = "8.0.0"
serde_json = "1.0.149"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
